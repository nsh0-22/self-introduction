<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わたしの自己紹介サイト</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<header>
    
</header>

<body>
  <div class="overlay"></div>

  <div class="content">
  <h1>Welcome to my page!!</h1>
    <p>ようこそ、わたしの自己紹介ページへ</p>
      <div class="introduction">
        このサイトは私のプログラミング自己学習のアウトプットの場です。
      </div>
      <div class="aboutme">
        私について
      </div>
    <ul>
      <li id="work">仕事</li>
      <li id="hobby">趣味</li>
    </ul>

    <div id="work-modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>

        <h2>仕事</h2>
          <p>
            人事の仕事をしています。エンジニア採用にも携わることがあります。<br>
            より深く彼らを理解したい、という思いが発端となりエンジニアになるための学習を始めました。
          </p>
      </div>
    </div>

    <div id="hobby-modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>

        <h2>趣味</h2>
          <p>
            最近はまっているのは筋トレとカメラです。<br>
            映画やアニメも好きで幅広く観ます。おすすめの作品などぜひ教えて欲しいです。
          </p>
      </div>
    </div>
  </div>

    <script src="main.js"></script>
</body>

</html>
